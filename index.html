<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escapade – idées de sorties en Suisse</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#18181b;--mut:#71717a;--line:#e7e5e0;--chip:#efede8;--acc:#e0442f;--ok:#0f766e;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c1f;--ink:#f4f4f5;--mut:#a1a1aa;--line:#2c2c31;--chip:#27272b}}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
button,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.03em;margin-right:auto;display:flex;gap:7px;align-items:center}
.logo i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--acc);color:#fff;font-size:15px}
.pill{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 4px 0 10px;height:36px}
.pill select{border:0;background:none;font-weight:600;padding:0 4px;height:34px;max-width:150px;outline:none}
.ibtn{height:36px;min-width:36px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 10px;font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:2px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700;color:var(--mut)}
.lang button.on{background:var(--ink);color:var(--bg)}
.rail{max-width:1200px;width:100%;margin:auto;display:flex;gap:8px;overflow-x:auto;padding:6px 16px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:78px;padding:9px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600}
.tile b{font-size:22px;line-height:1}
.tile.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1200px;margin:auto;padding:0 16px 90px}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
#q{height:36px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 12px;font:inherit;color:inherit;width:150px}
.status .count{font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto}
.tag{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--chip);border:0}
.tag.x::after{content:" ✕";opacity:.6}
.fbtn{font-weight:700}
.fbtn span{background:var(--acc);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:11px}
h2{font-size:17px;margin:22px 0 10px;letter-spacing:-.01em}
h2 small{color:var(--mut);font-weight:500;font-size:13px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.thumb{height:84px;display:grid;place-items:center;font-size:38px;position:relative}
.rib{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:#18181b}
.rib.end{background:#e0442f;color:#fff}.rib.live{background:#0f766e;color:#fff}.rib.soon{background:#f59e0b;color:#fff}
.star{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;background:rgba(255,255,255,.92);color:#0f766e;padding:3px 7px;border-radius:999px}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{margin:0;font-size:15px;line-height:1.25;font-weight:700}
.meta{font-size:13px;color:var(--mut)}
.foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:4px}
.price{font-weight:700;font-size:13px;margin-right:auto}
.price.free{color:var(--ok)}
.ic{font-size:13px;filter:grayscale(0)}.ic.off{opacity:.22;filter:grayscale(1)}
.more{display:block;margin:14px auto 0;border:1px dashed var(--line);background:none;border-radius:12px;padding:10px 16px;color:var(--mut);font-weight:600}
.empty{color:var(--mut);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
footer{max-width:1200px;margin:10px auto 0;padding:16px;color:var(--mut);font-size:12px}
footer button{border:0;background:none;text-decoration:underline;padding:0;color:inherit;font-size:12px}
.fab{position:fixed;right:16px;bottom:16px;z-index:25;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:13px 18px;font-weight:700;box-shadow:0 8px 24px rgba(224,68,47,.35)}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
@media(min-width:700px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 0 14px}
@media(min-width:700px){.sheet{border-radius:20px}}
.sh-h{position:sticky;top:0;background:var(--card);padding:16px 18px 8px;display:flex;align-items:center;gap:10px;z-index:1}
.sh-h h3{margin:0;font-size:18px;flex:1}
.x{border:0;background:var(--chip);border-radius:999px;width:32px;height:32px;font-size:15px}
.sb{padding:0 18px}
.dthumb{height:120px;display:grid;place-items:center;font-size:56px;border-radius:14px;margin-bottom:12px;position:relative}
.drow{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.drow .k{font-size:17px}
.drow small{color:var(--mut);display:block}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.acts a{display:flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;font-weight:700;font-size:14px;padding:12px;border-radius:12px;border:1px solid var(--line)}
.acts a.pri{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts a:nth-child(even):last-child{grid-column:1/-1}
.facts{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
@media(max-width:420px){.facts{grid-template-columns:1fr}}
.desc{margin:0 0 8px;color:var(--mut)}
.addr{display:inline-block;margin:0 0 4px;font-size:14px;font-weight:600;text-decoration:none;border-bottom:1px dashed var(--line)}
.fgroup{margin:6px 0 14px}.fgroup p{margin:0 0 7px;font-weight:700;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sfoot{display:flex;gap:8px;padding:10px 18px calc(10px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin-top:8px;z-index:3}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-weight:700}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 10px;text-align:left;font-weight:600;font-size:14px}
.opt b{display:block;font-size:24px;margin-bottom:2px}
.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.prog{display:flex;gap:4px;margin:0 0 14px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.prog i.on{background:var(--acc)}
.q{font-size:17px;font-weight:700;margin:0 0 12px}
.src a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;font-size:14px}
.src a span{color:var(--mut);font-size:12px;white-space:nowrap}
@media(max-width:560px){.logo span{display:none}.bar{gap:6px;padding:8px 12px}.pill select{max-width:96px}.lang button{padding:5px 6px}.rail{padding:4px 12px 10px}.tile{width:70px}main{padding:0 12px 90px}.grid{grid-template-columns:1fr 1fr;gap:10px}.thumb{height:70px;font-size:32px}.cb h3{font-size:14px}.meta{font-size:12px}.foot .ic{font-size:11px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
@media(max-width:560px){.dthumb{height:80px;font-size:40px}}
html,body{overflow-x:hidden}
.bar2{max-width:1200px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;align-items:center}
.bar2::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;height:32px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:12px}
.sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 4px}
.tile{width:96px}
.hrail{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.stp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-size:13px;font-weight:600}
.stp button{width:28px;height:28px;border-radius:999px;padding:0;border:1px solid var(--line)}
.stps{display:flex;flex-direction:column;gap:10px;grid-column:1/-1}
.stpbig{display:grid;grid-template-columns:1fr 52px 40px 52px;align-items:center;gap:8px;font-weight:700}
.stpbig .opt{text-align:center;font-size:22px;padding:6px}.stpbig b{text-align:center;font-size:20px}
button.tag{border:0;cursor:pointer}
.fav{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:18px;color:#18181b;cursor:pointer;line-height:1}
.fav.on{color:#e0442f}
.star{top:auto;bottom:8px;right:auto;left:8px;font-size:11px;font-weight:700;padding:4px 8px}
.hfav{border:0;background:var(--chip);border-radius:999px;width:32px;height:32px;font-size:17px;line-height:1}
.hfav.on{color:#e0442f}
:root{--lift:0px}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--lift) + env(safe-area-inset-bottom));z-index:30;display:flex;gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.14);width:min(440px,calc(100% - 24px))}
.bnav button{flex:1;border:0;background:none;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut)}
.bnav button b{font-size:19px;line-height:1.1;position:relative;color:var(--ink)}
.bnav button b i{position:absolute;top:-4px;right:-12px;font-style:normal;font-size:10px;background:var(--acc);color:#fff;border-radius:999px;padding:1px 5px}
.bnav button.on{background:var(--ink);color:var(--bg)}.bnav button.on b{color:var(--bg)}
.fab{bottom:calc(84px + var(--lift) + env(safe-area-inset-bottom))!important}
main{padding-bottom:calc(170px + var(--lift))!important}
footer{padding-bottom:110px}
body.favview .rail,body.favview .bar2{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(150px + var(--lift) + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:560px){#btnF{display:none}#q{flex:1;width:auto}}
</style>
</head>

$("ov").addEventListener("click",e=>{const df=e.target.closest("[data-dfav]");if(df){toggleFav(df.dataset.dfav);const on=isFav(df.dataset.dfav);df.classList.toggle("on",on);df.textContent=on?"♥":"♡";render();return}if(e.target.id==="ov"||e.target.closest(".x"))closeSheet()});
function openDetail(id){const it=DATA.find(x=>x.id===id),t=T(),st=status(it),tr=travel(it),[ic,bg]=CAT[it.cat]||["✦","#eee"];
  const name=tx(it.t),from=S.from.split("/")[0],stop=it.addr||it.stop||it.city,q=encodeURIComponent,ll=`${it.lat},${it.lon}`,[E,N]=lv95(it.lat,it.lon);
  const dest=it.addr?q(it.addr):(it.kind==="perm"&&it.cat!=="hike"&&it.cat!=="view"?q(name+", "+it.city):ll);const site=it.url||`https://www.google.com/search?q=${q(name+" "+it.city+" site officiel")}`;
  const sbb=`https://www.sbb.ch/${t.sbbPath}/pages/fahrplan/fahrplan.xhtml?von=${q(from)}&nach=${q(stop)}`;
  const car=`https://www.google.com/maps/dir/?api=1&origin=${q(from+", Switzerland")}&destination=${dest}&travelmode=driving`;
  const park=`https://www.google.com/maps/search/parking/@${ll},16z`,food=`https://www.google.com/maps/search/restaurant/@${ll},16z`;
  const ev=`https://map.geo.admin.ch/?lang=${L}&E=${E}&N=${N}&zoom=9&layers=ch.bfe.ladestellen-elektromobilitaet`;
  const row=(k,lab,val,sub="")=>`<div class="drow"><span class="k">${k}</span><div><small>${lab}</small>${val}${sub?`<small>${sub}</small>`:""}</div></div>`;
  const virt=it.virtual;
  openSheet(`<div class="sh-h"><h3>${name}</h3><button class="hfav ${isFav(it.id)?"on":""}" data-dfav="${it.id}">${isFav(it.id)?"♥":"♡"}</button><button class="x">✕</button></div><div class="sb">
  <div class="dthumb" style="background:${bg}">${ic}<span class="rib ${st.c}">${it.from&&it.kind!=="perm"?(st.c==="end"?st.lbl+" · ":"")+`${fmt(it.from)} → ${fmt(it.to)}`:st.lbl}</span></div>
  ${it.d?`<p class="desc">${tx(it.d)}</p>`:""}${!virt?`<a class="addr" href="https://www.google.com/maps/search/?api=1&query=${dest}" target="_blank" rel="noopener">📍 ${it.addr||it.city+" ("+it.cn+")"} ↗</a>`:""}
  <div class="acts"><a class="pri" href="${site}" target="_blank" rel="noopener">${it.url?"🌐 "+t.act.site:"🔎 "+t.act.find}</a>${virt?"":`
  ${it.pt?`<a href="${sbb}" target="_blank" rel="noopener">🚆 ${t.act.sbb}</a>`:""}<a href="${car}" target="_blank" rel="noopener">🚗 ${t.act.car}</a>
  <a href="${park}" target="_blank" rel="noopener">🅿️ ${t.act.park}</a><a href="${ev}" target="_blank" rel="noopener">${t.act.ev}</a>
  <a href="${food}" target="_blank" rel="noopener">🍴 ${t.act.food}</a>`}</div>
  <div class="facts">${row("💶",t.lab.price,priceTxt(it.price),[it.price.n?tx(it.price.n):"",(()=>{const g=grp(),tt=total(it.price);return tt!=null&&g.a+g.c>1?`<b>${t.total} ${t.grp(g.a,g.c)} : CHF ${chf(tt)}</b>`:""})()].filter(Boolean).join("<br>"))}
  ${virt?"":row("🧭",t.lab.time,`🚗 ${hm(tr.car)} ${t.car}${tr.tp?` · 🚆 ≈ ${hm(tr.tp)} ${t.train}`:""}`,`${S.from} → ${it.city} (${it.cn})`)}
  ${it.dur?row("⏱️",t.lab.dur,it.dur):""}
  ${virt?"":row("🅿️",t.lab.park,t.park[it.park])+row("⚡",t.lab.ev,t.ev[it.ev])}
  ${virt?"":row("🍴",t.lab.food,t.food[it.food==null?"null":it.food])}
  ${virt?"":row("♿",t.lab.pmr,t.pmr[it.pmr==null?"null":it.pmr])}
  ${row("🏠",t.lab.io,t.io[String(it.in)])}</div>
  </div>`)}
function openFilters(keep){const t=T().f;const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${String(S[key])===String(v)?"on":""}" data-k="${key}" data-v="${v}">${l}</button>`).join("")}</div>`;
  const tog=(key,l)=>`<button class="${S[key]?"on":""}" data-tog="${key}">${l}</button>`;const pm=T().pmr;const g=grp();const stp=(k,l,min)=>`<span class="stp">${l} <button data-st="${k}" data-d="-1" data-min="${min}">−</button><b>${k==="na"?g.a:g.c}</b><button data-st="${k}" data-d="1" data-min="${min}">+</button></span>`;
  openSheet(`<div class="sh-h"><h3>${T().filters}</h3><button class="x">✕</button></div><div class="sb" id="fs">
  <div class="fgroup"><p>👥 ${T().people}</p><div class="seg">${stp("na",T().adults,1)}${stp("nc",T().children,0)}</div></div>
  <div class="fgroup"><p>${t.price}</p>${seg("price",[["all",t.pAll],["0",t.p0],["20",t.p20],["50",t.p50]])}</div>
  <div class="fgroup"><p>${t.time}</p>${seg("time",[["all",t.tAll],["30","30′"],["60","1h"],["90","1h30"],["120","2h"]])}</div>
  <div class="fgroup"><p>${t.park}</p><div class="seg">${tog("pk","🅿️ "+t.pk)}${tog("ev","⚡ "+t.ev)}</div></div>
  <div class="fgroup"><p>🍴</p><div class="seg">${tog("food",t.food)}</div></div>
  <div class="fgroup"><p>${t.pmr}</p>${seg("pmr",[[0,t.tAll],[1,"🦯 "+pm[1]],[2,"♿ "+pm[2]]])}</div>
  </div><div class="sfoot"><button class="btn" id="fReset">${t.reset}</button><button class="btn pri" id="fApply">${t.apply}</button></div>`,keep===1);
  $("fs").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.st){const g=grp();P=P||{};const k=b.dataset.st;P[k]=Math.max(+b.dataset.min,(k==="na"?g.a:g.c)+(+b.dataset.d));if(k==="na")P.nc=g.c;else P.na=g.a;store.set("esc_p2",P)}else if(b.dataset.tog){S[b.dataset.tog]=!S[b.dataset.tog]}else if(b.dataset.k){S[b.dataset.k]=b.dataset.k==="pmr"?+b.dataset.v:b.dataset.v}openFilters(1)};
  $("fReset").onclick=()=>{Object.assign(S,{price:"all",time:"all",pk:false,ev:false,food:false,pmr:0});openFilters()};
  $("fApply").onclick=()=>{closeSheet();render()}}
function openSources(){const t=T();openSheet(`<div class="sh-h"><h3>${t.srcT}</h3><button class="x">✕</button></div><div class="sb"><p class="desc">${t.srcS}</p><div class="src">${SRC.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${s.name}<span>${s.area} ↗</span></a>`).join("")}</div></div>`)}
// ---------- wizard
let W={i:0,d:{}},WL=-1;
function wiz(){const keep=WL===W.i;WL=W.i;const t=T().wiz,d=W.d,steps=["who",...(d.who==="kids"?["age"]:[]),...(["kids","friends","team","seniors"].includes(d.who)?["size"]:[]),"mob","likes","budget","move"],k=steps[W.i],last=W.i===steps.length-1;
  const opt=(key,v,ic,l,multi)=>`<button class="opt ${(multi?(d[key]||[]).includes(v):d[key]==v)?"on":""}" data-key="${key}" data-v="${v}" data-m="${multi?1:0}"><b>${ic}</b>${l}</button>`;
  const Q={who:[t.who,Object.entries(t.whoO).map(([v,[i,l]])=>opt("who",v,i,l))],age:[t.age,Object.entries(t.ages).map(([v,l])=>opt("age",v,"🧒",l))],mob:[t.mob,Object.entries(t.mobO).map(([v,[i,l]])=>opt("mob",v,i,l))],
    likes:[t.likes,Object.keys(CAT).map(c=>opt("likes",c,CAT[c][0],T().tiles[c],1))],size:[T().size,[`<div class="stps">${[["na",T().adults,1],["nc",T().children,0]].map(([k,l,min])=>`<div class="stpbig"><span>${l}</span><button class="opt" data-key="${k}" data-v="${Math.max(min,(+(d[k]??(k==="na"?2:(d.who==="kids"?1:0))))-1)}">−</button><b>${d[k]??(k==="na"?2:(d.who==="kids"?1:0))}</b><button class="opt" data-key="${k}" data-v="${(+(d[k]??(k==="na"?2:(d.who==="kids"?1:0))))+1}">+</button></div>`).join("")}</div>`]],budget:[t.budget,Object.entries(t.bud).map(([v,[i,l]])=>opt("budget",v,i,l))],move:[t.move,Object.entries(t.moveO).map(([v,[i,l]])=>opt("move",v,i,l))]}[k];
  openSheet(`<div class="sh-h"><h3>${t.title}</h3><button class="x">✕</button></div><div class="sb"><div class="prog">${steps.map((_,i)=>`<i class="${i<=W.i?"on":""}"></i>`).join("")}</div><p class="q">${Q[0]}</p><div class="opts" id="wo">${Q[1].join("")}</div></div>
  <div class="sfoot">${W.i?`<button class="btn" id="wB">${t.back}</button>`:""}<button class="btn pri" id="wN">${last?t.done:t.next}</button></div>`,keep);
  $("wo").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;const{key,v,m}=b.dataset;if(m==="1"){const a=d[key]||[];d[key]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else{d[key]=v;if(!last&&key!=="na"&&key!=="nc"){W.i++;}}wiz()};
  if($("wB"))$("wB").onclick=()=>{W.i--;wiz()};
  $("wN").onclick=()=>{if(!last){W.i++;wiz();return}const dn=d.who==="couple"?2:d.who==="kids"||d.who==="friends"||d.who==="team"||d.who==="seniors"?2:1;P={who:d.who,na:+(d.na??dn),nc:+(d.nc??(d.who==="kids"?1:0)),age:d.age!=null?+d.age:null,mob:d.mob||"none",likes:d.likes||[],budget:d.budget!=null?+d.budget:null,move:d.move||"car"};store.set("esc_p2",P);closeSheet();render()}}
function openWiz(){WL=-1;W={i:0,d:P?{...P,likes:[...(P.likes||[])]}:{}};wiz()}
// ---------- events
$("lang").onclick=e=>{const l=e.target.dataset.l;if(l){L=l;store.set("esc_lang",L);render()}};
$("rail").onclick=e=>{const b=e.target.closest(".tile");if(!b)return;S.uni=b.dataset.u;S.sub="all";PAGE=1;render();scrollTo({top:0,behavior:"smooth"})};
$("bar2").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.sub)S.sub=b.dataset.sub;else if(b.dataset.q)S[b.dataset.q]=!S[b.dataset.q];PAGE=1;render()};
$("bar2").onchange=e=>{if(e.target.id==="when"){S.when=e.target.value;PAGE=1;render()}};
$("from").onchange=e=>{S.from=e.target.value;store.set("esc_from",S.from);render()};
$("btnProfile").onclick=openWiz;
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.nav;if(k==="filters")return openFilters();if(k==="profile")return openWiz();VIEW=k;PAGE=1;render();scrollTo({top:0})};
$("list").onclick=e=>{const f=e.target.closest("[data-fav]");if(f){e.stopPropagation();toggleFav(f.dataset.fav);const on=isFav(f.dataset.fav);f.classList.toggle("on",on);f.textContent=on?"♥":"♡";if(VIEW==="fav")render();return}const c=e.target.closest(".card");if(c)return openDetail(c.dataset.id);const m=e.target.closest(".more");if(m){if(m.dataset.closed)SHOWCLOSED=true;else PAGE++;render()}};
$("fab").onclick=()=>{const pool=DATA.filter(it=>pass(it)&&["now","soon","always"].includes(status(it).g)&&!it.virtual);if(!pool.length)return;const w=pool.map(it=>Math.max(1,score(it)+5));let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while((r-=w[i])>0)i++;openDetail(pool[i].id)};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
(function(){const nl=(navigator.language||"fr").slice(0,2);L=store.get("esc_lang")||(I[nl]?nl:"fr");P=store.get("esc_p2");FAV=new Set(store.get("esc_fav")||[]);const ss=store.get("esc_s");if(ss&&UNI[ss.uni])Object.assign(S,ss);const f=store.get("esc_from");if(f&&PLACES[f])S.from=f;
  fetch("activities.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{DATA=j.items;SRC=j.sources||[];UPD=j.updated;render();if(!P)openWiz()}).catch(()=>{$("list").innerHTML='<div class="empty">Data unavailable.</div>'})})();
